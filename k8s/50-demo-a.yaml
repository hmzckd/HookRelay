apiVersion: v1
kind: Service
metadata:
  name: demo-a
  namespace: hookrelay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hookrelay
    app.kubernetes.io/component: demo-a
  ports:
    - name: http
      port: 18080
      targetPort: 18080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-a
  namespace: hookrelay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hookrelay
      app.kubernetes.io/component: demo-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hookrelay
        app.kubernetes.io/component: demo-a
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: receiver
          image: hookrelay:local
          imagePullPolicy: Never
          command: ["/app/demo-receiver"]
          args: ["-listen", "0.0.0.0:18080", "-key-id", "demo/a-v1"]
          ports:
            - name: http
              containerPort: 18080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hookrelay-secrets
                  key: DATABASE_URL
            - name: DEMO_RECEIVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: hookrelay-secrets
                  key: DEMO_A_SECRET
            - name: HOOKRELAY_CONTAINER_MODE
              valueFrom:
                configMapKeyRef:
                  name: hookrelay-config
                  key: HOOKRELAY_CONTAINER_MODE
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
